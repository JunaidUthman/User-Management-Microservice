# =================================================================
# Core Server Configuration
# =================================================================
server.port=8080
spring.application.name=user-management-microservice

# =================================================================
# PostgreSQL Datasource Configuration
# =================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/userdatabase?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# =================================================================
# JPA / Hibernate Configuration
# =================================================================
# Specify the SQL dialect for mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ddl-auto settings for schema management:
# - create-drop: Drops tables on exit, creates them on startup (good for testing)
# - update: Attempts to update schema, but can be dangerous/unpredictable
# - none: Recommended for production/dev environments with migrations (Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console (helpful for debugging entity mappings)
spring.jpa.show-sql=true

# Format the SQL queries to be readable (optional)
spring.jpa.properties.hibernate.format_sql=true

# =================================================================
# JMX Setting (To prevent potential errors when running multiple services)
# =================================================================
spring.jmx.enabled=false